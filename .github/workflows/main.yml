name: Global Media OS Builder

on:
  schedule:
    - cron: '17 * * * *'  # 毎時17分に自動実行（1時間おき・混雑回避の奇数分）
  workflow_dispatch:      # 手動実行ボタン

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # 過去のキャッシュデータをGitHubリポジトリへ安全に自動コミットするため
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なパッケージのインストール
        run: |
          python -m pip install --upgrade pip
          # AIパッケージ(google-genai)を削除し、標準ライブラリのみで動作させます

      - name: 取引所価格チェッカーの自動生成
        run: python build_portal.py

      - name: 過去10件のキャッシュデータをGitHubリポジトリへ安全に自動保存(Commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "🤖 Auto: キャッシュデータベースの自動更新"
          git push || echo "⚠️ 保存競合が発生したためスキップし、デプロイを優先します。"

      - name: Cloudflare製動的ルーティングのための準備 (distフォルダ化)
        run: |
          mkdir -p dist/asset-os-connection
          cp index.html dist/asset-os-connection/

      - name: Cloudflare Workers へ安全にデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat wrangler.json | jq '. + {assets: {"directory": "./dist"}}' > wrangler_temp.json
          mv wrangler_temp.json wrangler.json
          npx wrangler deploy
